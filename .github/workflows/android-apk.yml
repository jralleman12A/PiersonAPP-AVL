name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check the APK will install
        working-directory: app/android/app/build/outputs/apk/debug
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs app-debug.apk
          "$BT/aapt2" dump badging app-debug.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|testOnly)"
          if "$BT/aapt2" dump xmltree app-debug.apk --file AndroidManifest.xml | grep -q testOnly; then
            echo "::error::APK is marked testOnly and phones will refuse to install it"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: avl-field-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  j2-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j2-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
