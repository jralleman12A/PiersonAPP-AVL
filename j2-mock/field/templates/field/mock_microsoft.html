<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in (test)</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; color: #1e293b; }
  .card { max-width: 360px; margin: 48px auto; background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #b45309; background: #fef3c7; display: inline-block; padding: 3px 8px; border-radius: 4px; }
  h1 { font-size: 20px; margin: 14px 0 4px; }
  p { font-size: 13px; color: #64748b; margin: 0 0 18px; }
  button { width: 100%; height: 52px; border: 1px solid #e2e8f0; border-radius: 12px; background: white; text-align: left; padding: 0 16px; font-size: 14px; cursor: pointer; }
  button b { display: block; }
</style>
</head>
<body>
  <div class="card">
    <span class="tag">Test server · not Microsoft</span>
    <h1>Pick an account</h1>
    <p>Stands in for login.microsoftonline.com until J2's Entra app has a redirect URI for this server.</p>
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit"><b>{{ user.first_name }} {{ user.last_name }}</b>{{ user.email }}</button>
    </form>
  </div>
</body>
</html>
